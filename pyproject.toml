[project]
name = "updv"
dynamic = ["version"]
description = "version string updater."
readme = "README.md"
license = "BSD-3-Clause"
dependencies = [
]

requires-python = ">=3.11"

keywords = [
]

authors = [
    { name = "juanvel400" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/juanvel4000/updv"
Repository = "https://github.com/juanvel4000/updv"
Issues = "https://github.com/juanvel4000/updv/issues"
Changelog = "https://github.com/juanvel4000/updv/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/updv/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "packaging",
]

[project.scripts]
updv = "updv.cli:main"
